services:
  - type: web
    name: pilot-logbook
    env: python
    region: oregon
    plan: free
    branch: master
    buildCommand: "bash build.sh"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLIGHTAWARE_API_KEY
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_FILE
        value: credentials.json
      - key: AIRCRAFT_TAIL_NUMBER
        value: N790TB
      - key: AIRCRAFT_MAKE
        value: SOCATA
      - key: AIRCRAFT_MODEL
        value: TBM 700B
      - key: DEFAULT_PILOT_FUNCTION
        value: PIC
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PORT
        value: 5051
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FILE
        value: logbook_data.json
